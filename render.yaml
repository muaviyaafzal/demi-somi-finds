# Render blueprint — one-click deploy for Demi Somi Finds.
# Push this project to a GitHub repo, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.
# Render reads this file and creates the free web service.
#
# NOTE (free plan): Render's free tier does NOT allow persistent disks,
# so there is no disk here. The SQLite database and uploaded images
# live on the service's ephemeral filesystem and are wiped on every
# restart/redeploy. The build runs the seed script, so the 5 demo
# products come back automatically — but products added in the admin
# panel will be lost on a restart. For permanent storage, upgrade the
# service to the Starter plan and add a disk (see README).
services:
  - type: web
    name: demi-somi-finds
    env: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
